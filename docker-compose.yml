services:
  whatsapp:
    build: .
    image: voice-to-text-bot:latest
    restart: unless-stopped
    env_file: .env
    # Put a TLS reverse proxy in front of this port for Meta's webhook.
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  telegram:
    image: voice-to-text-bot:latest
    command: ["python", "telegram_bot.py"]
    restart: unless-stopped
    env_file: .env
    # Long polling: no port needed.
    depends_on:
      - whatsapp
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
